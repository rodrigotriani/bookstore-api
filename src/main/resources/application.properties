spring.application.name=bookstore-api
server.port=8080

# In-memory H2 database: local demo only, data is lost on restart.
spring.datasource.url=jdbc:h2:mem:bookstoredb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Demo-only schema management; use migrations (Flyway/Liquibase) for real deployments.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
